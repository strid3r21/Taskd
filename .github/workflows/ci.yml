name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    # Pushes to main run on our own Linux runner (a container on the Unraid server).
    # Pull requests run on a disposable GitHub-hosted VM instead (free for public repos):
    # a PR's code must never run on the persistent Unraid runner. NB: a fork PR can edit this
    # file, so the real gate is the repo setting "require approval for all outside contributors".
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","unraid"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Sampler benchmark
        run: |
          ./target/release/taskdm --bench 300 | tee bench.txt
          {
            echo '### Sampler benchmark'
            echo '```'
            cat bench.txt
            echo '```'
            echo "Binary size: $(du -h target/release/taskdm | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
