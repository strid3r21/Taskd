name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Link against an old glibc so the binary runs on Ubuntu 20.04+/Debian 11+/Mint 20+,
  # not just on whatever (newer) distro the runner container happens to use.
  GLIBC_BASELINE: '2.31'
  ZIG_VERSION: 0.14.1
  ZIG_SHA256: 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
  CARGO_ZIGBUILD_VERSION: 0.24.1

jobs:
  release:
    runs-on: [self-hosted, linux, unraid]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml version $v"; exit 1; }

      - name: Test
        run: cargo test --locked

      - name: Install zig and cargo-zigbuild
        run: |
          dir="$RUNNER_TEMP/zig-$ZIG_VERSION"
          if [ ! -x "$dir/zig" ]; then
            curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
            echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
            mkdir -p "$dir" && tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$dir" --strip-components=1
          fi
          echo "$dir" >> "$GITHUB_PATH"
          cargo zigbuild --version 2>/dev/null | grep -q "$CARGO_ZIGBUILD_VERSION" \
            || cargo install cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION" --locked

      - name: Build (glibc ${{ env.GLIBC_BASELINE }} baseline)
        run: |
          cargo zigbuild --release --locked --target "x86_64-unknown-linux-gnu.$GLIBC_BASELINE"
          cp target/x86_64-unknown-linux-gnu/release/taskd target/release-taskd

      - name: Check glibc requirement
        run: |
          need="$(grep -ao 'GLIBC_2\.[0-9.]*' target/release-taskd | sort -Vu | tail -1)"
          echo "Binary requires $need (baseline GLIBC_$GLIBC_BASELINE)"
          [ "$(printf '%s\n%s\n' "$need" "GLIBC_$GLIBC_BASELINE" | sort -V | tail -1)" = "GLIBC_$GLIBC_BASELINE" ] \
            || { echo "::error::binary needs $need, newer than GLIBC_$GLIBC_BASELINE"; exit 1; }
          ./target/release-taskd --version
          ./target/release-taskd --bench 50 | head -3

      - name: Package
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="taskd-$v-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release-taskd "dist/$name/taskd"
          cp packaging/taskd.desktop packaging/taskd.svg packaging/install.sh README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          TASKD_BIN=target/release-taskd packaging/build-deb.sh dist
          (cd dist && sha256sum ./*.tar.gz ./*.deb > SHA256SUMS)
          ls -la dist

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: taskd-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
