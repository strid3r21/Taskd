name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Link against an old glibc so the binary runs on Ubuntu 20.04+/Debian 11+/Mint 20+,
  # not just on whatever (newer) distro the runner container happens to use.
  GLIBC_BASELINE: '2.31'
  ZIG_VERSION: 0.14.1
  ZIG_SHA256: 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
  CARGO_ZIGBUILD_VERSION: 0.24.1

jobs:
  build:
    # Built on our own Unraid runner. It never sees the signing key or a write token:
    # signing and publishing happen in the separate job below.
    runs-on: [self-hosted, linux, unraid]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml version $v"; exit 1; }

      - name: Test
        run: cargo test --locked

      - name: Install zig and cargo-zigbuild
        run: |
          dir="$RUNNER_TEMP/zig-$ZIG_VERSION"
          if [ ! -x "$dir/zig" ]; then
            curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
            echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
            mkdir -p "$dir" && tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$dir" --strip-components=1
          fi
          echo "$dir" >> "$GITHUB_PATH"
          cargo zigbuild --version 2>/dev/null | grep -q "$CARGO_ZIGBUILD_VERSION" \
            || cargo install cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION" --locked

      - name: Build x86_64 and aarch64 (glibc ${{ env.GLIBC_BASELINE }} baseline)
        run: |
          for arch in x86_64 aarch64; do
            cargo zigbuild --release --locked --target "$arch-unknown-linux-gnu.$GLIBC_BASELINE"
            cp "target/$arch-unknown-linux-gnu/release/taskdm" "target/release-taskdm-$arch"
          done

      - name: Check binaries
        run: |
          for arch in x86_64 aarch64; do
            bin="target/release-taskdm-$arch"
            need="$(grep -ao 'GLIBC_2\.[0-9.]*' "$bin" | sort -Vu | tail -1)"
            echo "$arch binary requires $need (baseline GLIBC_$GLIBC_BASELINE)"
            [ "$(printf '%s\n%s\n' "$need" "GLIBC_$GLIBC_BASELINE" | sort -V | tail -1)" = "GLIBC_$GLIBC_BASELINE" ] \
              || { echo "::error::$arch binary needs $need, newer than GLIBC_$GLIBC_BASELINE"; exit 1; }
          done
          # ELF machine field: 0x3e = x86-64, 0xb7 = AArch64.
          [ "$(od -An -tx1 -j18 -N1 target/release-taskdm-aarch64 | tr -d ' ')" = b7 ] \
            || { echo "::error::aarch64 build isn't an AArch64 binary"; exit 1; }
          ./target/release-taskdm-x86_64 --version
          ./target/release-taskdm-x86_64 --bench 50 | head -3

      - name: Package
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          for arch in x86_64 aarch64; do
            name="taskd-monitor-$v-$arch-linux"
            mkdir -p "dist/$name"
            cp "target/release-taskdm-$arch" "dist/$name/taskdm"
            cp packaging/taskd-monitor.desktop packaging/taskd-monitor.svg packaging/install.sh README.md LICENSE "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          TASKD_BIN=target/release-taskdm-x86_64 DEB_ARCH=amd64 packaging/build-deb.sh dist
          TASKD_BIN=target/release-taskdm-aarch64 DEB_ARCH=arm64 packaging/build-deb.sh dist
          (cd dist && sha256sum ./*.tar.gz ./*.deb > SHA256SUMS)
          packaging/aur/render.sh dist "$v"
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
            dist/PKGBUILD
          retention-days: 7

  publish:
    # Signs SHA256SUMS and publishes the release. Runs on a fresh GitHub-hosted VM so the
    # signing key and the write token never touch the persistent self-hosted runner.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::RELEASE_SIGNING_KEY is not set; refusing to publish an unsigned release"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/signing.pem"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm -f "$key"
          # The key must match the public key built into the app, or updates would be rejected.
          openssl pkeyutl -verify -pubin -inkey packaging/release-key.pem -rawin -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig
          (cd dist && sha256sum -c SHA256SUMS)

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/PKGBUILD
